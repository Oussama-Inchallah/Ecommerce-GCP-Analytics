# This file is the main configuration file for your dbt project. 
# It contains information about your project, such as its name, version, 
# and the paths to your models, snapshots, macros, and tests. 
name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_analytics' #specifies the profile that dbt should use to connect to your database.

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2022-12-1'

models:
  ecommerce_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

seeds:
  ecommerce_analytics:
    +schema: raw_ecommerce   # seeds land in schema "raw_ecommerce" (see macros/generate_schema_name.sql)
