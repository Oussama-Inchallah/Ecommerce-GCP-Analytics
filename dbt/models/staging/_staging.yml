version: 2

models:
  - name: stg_orders
    description: "Typed and snake_case staging model for raw Amazon orders."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_date
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: total_amount
        tests: [not_null]
