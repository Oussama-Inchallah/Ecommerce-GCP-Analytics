version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]

  - name: dim_cities
    columns:
      - name: city_id
        tests: [unique, not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city, state, country]

  - name: dim_products
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fct_sales
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: city_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_cities')
                field: city_id
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['Pending', 'Processing', 'Shipped', 'Delivered', 'Cancelled', 'Returned']
      - name: quantity
        tests: [not_null]
      - name: total_amount
        tests: [not_null]
