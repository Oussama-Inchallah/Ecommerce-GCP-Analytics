services:
  # An empty warehouse. `dbt seed` loads the raw tables (seeds/*.csv).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecommerce_warehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # dbt docs serve defaults to 8080
  # Adminer uses 8082 so both can run side by side without a port clash.
  adminer:
    image: adminer:4.8.1
    depends_on:
      - postgres
    ports:
      - "8082:8080"

volumes:
  postgres_data:
